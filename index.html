<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمات بنك أمدرمان الوطني (أوكاش)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --main-green: #1a8a3f;
            --green-dark: #0f6b2f;
            --green-light: #e8f5e9;
            --text-color: #333;
            --white: #fff;
            --gray-light: #f8f9fa;
            --footer-dark-gray: #ccc;
            --font-main: 'Tajawal', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background: #f4f4f4;
            color: var(--text-color);
            direction: rtl;
            text-align: center;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(var(--main-green), var(--green-dark));
            padding: 15px 20px;
        }

        .top-header .logo-text { 
            color: white; 
            font-weight: bold; 
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-header .logo-text img {
            height: 45px;
            width: auto;
            border-radius: 8px;
        }

        .top-header .logo-text .logo-name {
            display: none;
        }

        .header-text {
            background: #ffcc00;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            color: #333;
        }

        .services-container {
            max-width: 1100px;
            margin: 60px auto;
            padding: 20px;
        }

        .services-title {
            font-size: 26px;
            color: var(--main-green);
            margin-bottom: 10px;
            font-weight: bold;
        }

        .services-subtitle {
            font-size: 16px;
            margin-bottom: 30px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
